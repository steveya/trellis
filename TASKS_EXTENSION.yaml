- id: P004
  title: 'Trellis extension: callable cap/floor collar with schedule tweaks'
  status: pending
  instrument_type: period_rate_option_strip
  construct:
  - analytical
  - monte_carlo
  description: Price a callable cap/floor collar with a non-standard accrual schedule.
    Return price and the relevant Greeks.
  market_scenario_id: usd_rates_smile
  validation_policy: invariants_and_cross_method
  expected_outcome: honest_block
  expected_blocker_ids:
  - dynamic_composition:callable_collar_control
  - dynamic_composition:callable_collar_continuation
  honest_block_contract:
    reason: callable_collar_dynamic_composition_missing
    summary: Trellis can value the scheduled cap and floor legs, but it cannot value
      the holder-controlled termination decision or continuation value of a callable
      collar. Pricing as a non-callable collar would be a false green.
    packet_type: dynamic_composition_gap
    missing_capabilities:
    - callable_collar_control
    - callable_collar_continuation
    suggested_action: Implement an exercise controller over the remaining collar-leg
      continuation value before enabling P004 pricing.
    follow_on_issue: QUA-1154
