- id: P006
  title: 'Trellis extension: basket credit nth-to-default with custom basket weights'
  status: pending
  instrument_type: nth_to_default
  construct:
  - copula
  - monte_carlo
  description: Price an nth-to-default basket with custom basket weights and return
    price plus spread sensitivities.
  market_scenario_id: usd_credit_ig
  validation_policy: invariants_and_cross_method
  cross_validate:
    internal:
    - weighted_rank_analytical
    - weighted_rank_monte_carlo
    tolerance_pct: 3.0
    output_tolerances_pct:
      spread_cs01: 15.0
    target_contracts:
      weighted_rank_analytical:
        method: copula
        route_id: credit_basket_nth_to_default
        route_family: nth_to_default
        backend_binding_id: trellis.models.contingent_cashflows.nth_to_default_probability
        variant_parameters: {rank_evidence: one_factor_integration, exposure_contract: name_weighted_terminal, spread_risk: parallel_1bp}
        validation_bundle_id: copula:nth_to_default
        payoff_family: nth_to_default
        exercise_style: none
        model_family: credit_copula
        underlying_asset_class: credit
        observation_style: terminal
      weighted_rank_monte_carlo:
        method: monte_carlo
        route_id: credit_basket_nth_to_default
        route_family: nth_to_default
        backend_binding_id: trellis.models.copulas.gaussian.GaussianCopula
        variant_parameters: {rank_evidence: sampled_default_times, exposure_contract: name_weighted_terminal, spread_risk: common_random_numbers_1bp}
        spec_overrides: {n_paths: 250000, seed: 42}
        validation_bundle_id: monte_carlo:nth_to_default
        payoff_family: nth_to_default
        exercise_style: none
        model_family: credit_copula
        underlying_asset_class: credit
        observation_style: terminal
  extension_contract:
    product: nth_to_default
    nth: 2
    basket_names:
    - A
    - B
    - C
    - D
    basket_weights:
    - 0.4
    - 0.2
    - 0.2
    - 0.2
    maturity_tenor: 5Y
    spread: 0.025
    recovery_rate: 0.4
    notional: 5000000.0
