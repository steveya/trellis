  conversion: an explicit decimal annual spread maps to hazard through spread /
    (1 - recovery); apply total notional, loss-given-default, expected ranked exposure,
    and discounting once through TriggerSettlement and trigger_settlement_pv
  model_range: terminal-settlement basket with homogeneous marginal credit and
    recovery, deterministic curves, equicorrelation, name weights, and parallel
    representative-spread CS01
  warning: Do not call price_nth_to_default_basket, claim weight-permutation effects
