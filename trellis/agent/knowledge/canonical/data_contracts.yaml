- name: PHYSICAL_BERMUDAN_SWAP_TAIL_LATTICE
  method: rate_tree
  source: explicit physical Bermudan contract plus exact named discount curve, forecast curve, and Hull-White parameter set
  convention: Each exercise date maps to an authored swap start and one co-terminal fixed/floating swap tail; all schedule, calendar, business-day, stub, roll, lag, day-count, compounding, gearing, and spread terms are explicit
  typical_range: positive notional, finite fixed rate/spread/gearing, non-negative lags, ordered live exercise dates, swap starts no earlier than exercise, and common maturity after every swap start
  model_expects: physical settlement, separate named discount and forecast curves, projection_policy=static_additive_forward_basis, one provenance-complete named constant-parameter Hull-White set, an explicit model-time day count/calendar, an authored positive lattice step count, and a bounded uniform lattice date tolerance
  conversion: Build every exercise-specific fixed/floating schedule first; derive initial discount-curve and forecast-curve forwards over each floating accrual, carry their additive basis onto nodewise lattice-implied discount forwards, discount every coupon at its authored payment date, then apply holder-max exercise rollback
  model_range: one-factor constant-parameter Hull-White lattice with deterministic static additive forward basis and exact fail-closed convention/date binding
  warning: Never fall back to the legacy Bermudan helper, European Black76, a discount-curve projection proxy, hidden schedule defaults, Black-vol-to-Hull-White conversion, or silent event-step deduplication; ACT/ACT ICMA coupons, parameterized day-of-month rolls, and non-shipped calendar aliases are not supported by this route
- name: volatility
  method: rate_tree
  source: market_state.vol_surface.black_vol(T, K)
  convention: Black lognormal implied volatility (annualized)
  typical_range: 0.10 to 0.60 (10% to 60%)
  model_expects: Hull-White absolute rate volatility (sigma_HW)
  conversion: 'sigma_HW = sigma_Black * forward_rate. Example: 0.20 * 0.05 = 0.01'
  model_range: 0.003 to 0.030 (0.3% to 3%)
  warning: NEVER pass Black vol directly to a rate tree. A Black vol of 0.20 means
    the RATE moves ~20% in RELATIVE terms. For a 5% rate, the absolute move is 0.20
    * 0.05 = 1% (0.01). Passing 0.20 directly makes rates range from -200% to +200%,
    producing nonsensical prices.
- name: volatility
  method: analytical
  source: market_state.vol_surface.black_vol(T, K)
  convention: Black lognormal implied volatility (annualized)
  typical_range: 0.10 to 0.60
  model_expects: Black lognormal vol (same convention — no conversion needed)
  conversion: None — use directly in black76_call(F, K, sigma, T)
  model_range: 0.10 to 0.60
  warning: ''
- name: SINGLE_NAME_DEFAULT_EVENT_COMPOSITION
  method: analytical
  source: build_default_event_grid(...) plus survival_curve.survival_probability(t)
  convention: Curve times use ACT/365 from the valuation origin; coupon accrual
    uses the declared contract day count; interval probabilities are conditional
    survival ratios, survival to the first live interval supplies the initial
    unconditional mass, and expected_first_event_weights propagates exact first-event
    and post-interval survival mass.
  typical_range: survival probabilities in [0, 1], non-negative interval event
    probabilities, positive discount factors, recovery in [0, 1]
  model_expects: one deterministic discount curve, one deterministic survival
    curve, one bounded event grid, and explicit CouponAccrual and ProtectionPayment
    leg assembly
  conversion: normalize spread quotes once, preserve coupon and curve time bases
    separately, pass survival to the first live interval as initial_survival_weight,
    and apply notional and signs only in the visible leg assembly
  model_range: one reference entity with fixed recovery and bounded within-period
    integration
  warning: Do not call product-level CDS schedule or pricing helpers from generated
    code, and do not treat conditional interval probabilities as unconditional
    default mass.
- name: RANKED_EVENT_WEIGHT_COMPOSITION
  method: analytical
  source: resolve_credit_basket_inputs(...) plus nth_to_default_probability(...)
  convention: Ordered unique names carry non-negative notional fractions summing
    to one when explicit; one homogeneous marginal default probability and one
    equicorrelation determine rank probability, and exchangeability maps that
    probability to mean ranked exposure
  typical_range: default and trigger probabilities in [0, 1], weights non-negative,
    explicit weights sum to 1, 1 <= rank <= pool size, recovery in [0, 1)
  model_expects: resolved name-aligned basket inputs, analytical one-factor rank
    integration, exchangeable expected-exposure reduction, and explicit terminal
    TriggerSettlement present-value assembly
  conversion: an explicit decimal annual spread maps to hazard through spread /
    (1 - recovery); apply total notional, loss-given-default, expected ranked exposure,
    and discounting once through TriggerSettlement and trigger_settlement_pv
  model_range: terminal-settlement basket with homogeneous marginal credit and
    recovery, deterministic curves, equicorrelation, name weights, and parallel
    representative-spread CS01
  warning: Do not call price_nth_to_default_basket, claim weight-permutation effects
    under exchangeability, infer a running premium leg, or treat spread as a coupon.
- name: RANKED_EVENT_WEIGHT_COMPOSITION
  method: copula
  source: resolve_credit_basket_inputs(...) plus nth_to_default_probability(...)
  convention: Ordered unique names carry non-negative notional fractions summing
    to one when explicit; one homogeneous marginal default probability and one
    equicorrelation determine rank probability, and exchangeability maps that
    probability to mean ranked exposure
  typical_range: default and trigger probabilities in [0, 1], weights non-negative,
    explicit weights sum to 1, 1 <= rank <= pool size, recovery in [0, 1)
  model_expects: resolved name-aligned basket inputs, analytical one-factor rank
    integration, exchangeable expected-exposure reduction, and explicit terminal
