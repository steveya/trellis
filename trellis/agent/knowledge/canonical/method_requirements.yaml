analytical:
  common:
  - 'OUTPUT CONTRACT: evaluate() must return a float present value. Return a non-empty
    JSON-serializable structure only when a caller explicitly expects structured output.'
  terminal_basket_option:
  - 'TERMINAL BASKET METHOD IDENTITY: Resolve the shared two-asset market contract
    with `resolve_terminal_basket_inputs`. Use Stulz only for best/worst-of claims,
    Kirk only for spreads, and Gauss-Hermite as an independent generic weighted-basket
    reference. These kernels are not interchangeable and product pricing wrappers
    are compatibility/reference APIs rather than generated construction authority.'
  - 'TERMINAL BASKET SETTLEMENT: Handle expiry intrinsic value explicitly, apply the
    resolved domestic discount factor exactly once, and apply notional exactly once.'
  black_scholes_equity:
  - 'BLACK-SCHOLES FORWARD CONSISTENCY: Derive the forward from spot and discounting
    before calling Black-style kernels. With no dividends, F = S0 / discount_curve.discount(T);
    then PV = discount_curve.discount(T) * Black(F, K, sigma, T). This is valid under
    lognormal spot (GBM) with deterministic rates and European exercise only.'
  - 'EQUITY MARKET DATA CONTRACT: Requires discounting and Black vol. Spot is an instrument/spec
    input, not a separate MarketState capability unless the product explicitly sources
    it from a live market snapshot.'
  garman_kohlhagen_fx:
  - 'GARMAN-KOHLHAGEN CONSISTENCY: Use spot FX, domestic discounting, foreign discounting,
    and Black vol. Covered interest parity gives F = S0 * df_foreign / df_domestic;
    then prefer the checked helper-backed FX vanilla path built on resolved inputs
    over reassembling Black76 basis claims inline, and use explicit basis-claim
    assembly only when the decomposition itself is the thing being validated.
    This is valid under lognormal FX spot with deterministic domestic and
    foreign rates.'
  - 'FX MARKET DATA CONTRACT: Requires `market_state.discount` for domestic discounting,
    `market_state.forecast_curves[...]` for the selected foreign discount curve, `market_state.forward_curve`
    for bridged foreign-carry / routing context, `market_state.vol_surface` for Black
    vol, and `market_state.fx_rates` or `market_state.spot` for spot FX.'
  black76_forward_rate:
  - 'BLACK76 FORWARD-RATE CONSISTENCY: Each period prices independently as a Black76
    call or put on the forward rate fixing at period start, discounted to settlement
    at period end. Valid under lognormal forward rate with deterministic discount
    factors.'
  - 'RATE-STYLE SWAPTION COMPOSITION CONTRACT: For a single-exercise European swaption,
    prefer the checked primitive path `resolve_swaption_black76_inputs(market_state, spec)`
    -> `ResolvedSwaptionBlack76Inputs` -> `price_swaption_black76_raw(resolved)`
    from `trellis.models.rate_style_swaption` instead of reassembling annuity,
    forward-swap-rate, expiry, and payment-count binding inline.'
  - 'CAP/FLOOR LOOP CONTRACT: Keep the explicit payment-timeline loop for caplet/floorlet
    strips. Do not force the single-exercise swaption composition onto period-by-period
    cap/floor routes.'
  - 'FORWARD-RATE MARKET DATA CONTRACT: Requires discount curve, forward curve (via
    forecast_forward_curve), and Black vol surface. Rate fixing dates and payment
    dates must match the instrument schedule.'
  jamshidian_zcb_option:
  - 'JAMSHIDIAN ZCB OPTION CONSISTENCY: For European zero-coupon bond options under
    the Hull-White / Jamshidian contract, compose
    `resolve_discount_bond_claim_inputs(...)` -> `ResolvedJamshidianInputs` ->
    `zcb_option_hw_raw(...)`, then apply option direction and notional once.
    `resolve_zcb_option_hw_inputs(...)` and `price_zcb_option_jamshidian(...)`
    are compatibility/reference surfaces, not generated construction authority.
    Do not degrade this route to generic Black76 on a forward bond price.'
  - 'ZCB OPTION STRIKE NORMALIZATION: Normalize strike quotes to unit face before
    the closed-form kernel. Treat `63` on `100` face as `0.63`, and require the
    underlying bond maturity to remain strictly after option expiry.'
  - 'ZCB OPTION MARKET DATA CONTRACT: Requires `market_state.discount` and `market_state.vol_surface`.
    Resolved inputs should carry discount factors at option expiry and bond maturity
    plus the mapped Black-style volatility quote at expiry.'
  - 'ZCB OPTION LATTICE CONTRACT: Resolve the same discount-bond claim with the
    selected `ho_lee` or `hull_white` model, build one calibrated generic lattice,
    use `lattice_backward_induction_result(..., terminal_step=bond_step,
    observation_steps=(expiry_step,))` for unit-bond values at expiry, then use
    `lattice_backward_induction(..., terminal_step=expiry_step)` for the option.
    Do not open-code rollback or call the retained ZCB-option tree wrappers.'
  credit_default_swap:
  - 'CREDIT-SURVIVAL CONSISTENCY: For single-name CDS, use build_period_schedule,
    build_default_event_grid, and conditional_event_probabilities_from_curve.
    Pass survival to the first live grid interval as initial_survival_weight so
    forward-start event and premium mass is unconditional from valuation.
    Use expected_first_event_weights for analytical evidence or
    sample_first_event_weights for Monte Carlo evidence. Do not call the retained
    build_cds_schedule or price_cds_* compatibility/reference helpers.'
  - 'CDS SPREAD UNITS: Running CDS spreads in task text are often quoted in basis
    points. Convert them to decimals before premium-leg accrual, for example 150
    bp -> 0.015; do not multiply accrual by a raw value like 150.0.'
  - 'CREDIT MARKET DATA CONTRACT: Requires credit_curve plus discount_curve. Declare
    both in the generated requirements set. Compose CouponAccrual/coupon_cashflow_pv
    and ProtectionPayment/protection_payment_pv explicitly so scheduled-leg,
    accrued-on-event, trigger-leg, discounting, and sign semantics remain visible.'
  nth_to_default:
  - 'NAME-WEIGHTED RANK INTEGRATION: Resolve the terminal basket with
    resolve_credit_basket_inputs, validate 1 <= n_th <= n_names, pass the resolved
    marginal default mass and equicorrelation to nth_to_default_probability, then
    map trigger probability to expected ranked exposure with
    exchangeable_ranked_event_expected_weight. Construct TriggerSettlement and
    trigger_settlement_pv explicitly; do not call price_nth_to_default_basket.'
  - 'NTH-DEFAULT SPREAD RISK: Treat spec spread as a decimal annual representative
    single-name market quote, map it through hazard = spread / (1 - recovery), and
    report spread_cs01 as PV(spread + 0.0001) - PV(spread). This is not a running
    coupon or premium leg.'
  - 'NTH-DEFAULT SUPPORT BOUNDARY: Name weights are supported with homogeneous
    marginal credit and recovery, terminal settlement, and equicorrelation.
    Heterogeneous curves/recoveries and running premium legs remain unsupported.'
  deterministic_cashflow:
  - 'DETERMINISTIC CASHFLOW CONTRACT: When all cashflows are known at pricing time
    and there is no optionality, PV = sum of cashflows * discount_factors. No vol
    surface or forward curve is needed.'
calibration:
- 'RATES CALIBRATION CONSISTENCY: Preserve the selected curve names from MarketState
  in every calibration result. Cap/floor and swaption calibration should clearly state
  the rate_index, discount curve provenance, and any caller-supplied volatility or
  correlation source labels.'
- 'CAP/FLOOR CALIBRATION: Calibrate the flat Black volatility against the selected
  OIS/forecast multi-curve environment by repricing the cap or floor quote with the
  exact caplet/floorlet stack used by the pricing route.'
- 'SWAPTION CALIBRATION: Calibrate the flat Black volatility against the selected
  multi-curve swaption environment by repricing the forward swap rate and annuity
  with the same curve selection used by the pricing route.'
rate_tree:
- 'CALIBRATION: The rate tree must be calibrated to reprice the input yield curve.
  At each time step, solve for theta(t) so that the tree-implied zero-coupon bond
  price matches curve.discount(T). Verify: tree_zcb(T) ≈ curve.discount(T) at key
  tenors.'
- 'DISCRETE CASHFLOWS: Bond coupons and other scheduled payments must be embedded
  at their actual payment dates (mapped to the nearest tree step), NOT spread uniformly
  across all steps. Uniform spreading introduces >10% pricing error.'
- 'EXERCISE LOGIC: The call/put decision at each node must compare the CONTINUATION
  VALUE (discounted expected future value) against the exercise price. The continuation
  value is computed from the tree''s own discount factors, not the flat input rate.'
- 'RATE-LATTICE SCOPE: Callable and puttable fixed income use the admitted generic
  rate-lattice composition. The legacy bermudan_swaption route remains compatibility
  evidence only. Convention-complete physical Bermudan swaptions must select the
  separate physical_bermudan_swaption_lattice route.'
- 'STRICT PHYSICAL BERMUDAN CONTRACT: Resolve every exercise-to-swap-start pair and
  its co-terminal fixed/floating schedules with resolve_co_terminal_swap_tails(...).
  Use the exact named discount and forecast curves, consume both legs full authored
  conventions, and price only physical settlement under the declared
  static_additive_forward_basis projection policy.'
- 'STRICT HULL-WHITE AUTHORITY: Resolve the exact named parameter set with
  resolve_named_hull_white_parameter_set(...). Never synthesize mean reversion,
  translate Black volatility into Hull-White sigma, or use the permissive legacy
  parameter resolver on physical_bermudan_swaption_lattice.'
- 'STRICT LATTICE DATE MAPPING: Preserve authored and adjusted dates, reject distinct
  dates that collide on one uniform-lattice step, and reject mappings beyond the
  authored maximum error. Require the model-time day count/calendar and positive
  lattice step count explicitly; do not describe nearest-step mapping as exact-date
  support.'
- 'EQUITY-TREE SCOPE: For American/Bermudan equity options, import BinomialTree from
  trellis.models.trees.binomial and backward_induction from trellis.models.trees.backward_induction,
  then use BinomialTree.crr(...) and backward_induction(..., exercise_type="american"|"bermudan").
  Treat the exact route family as equity_tree. Do not invent crr_tree, AMERICAN, or
  a method="lsm" fallback for the tree route.'
monte_carlo:
- 'TERMINAL BASKET MC COMPOSITION: Resolve inputs with `resolve_terminal_basket_inputs`,
  build `CorrelatedGBM` and `MonteCarloEngine`, and evaluate terminal states with
  `terminal_basket_option_payoff`. Do not route a terminal-only claim through the
  ranked-observation state machine or a product pricing wrapper.'
- 'CONVERGENCE: Use at least 10,000 paths. Verify that the standard error is <1% of
  the price. If path-dependent, use at least 100 time steps per year.'
- 'DISCRETE OBSERVATIONS: For instruments with discrete fixing/observation dates (Asian
  options, barriers), simulate paths that pass through those exact dates. Do not interpolate
  between steps.'
- 'EARLY EXERCISE: For American or Bermudan exercise in Monte Carlo, use an approved
  optimal-stopping control primitive instead of inventing method="lsm" or treating
  engine.price(...) as a substitute for early-exercise control. Trellis currently
  implements longstaff_schwartz. Planned policy classes include tsitsiklis_van_roy,
  primal_dual_mc, and stochastic_mesh. If the control primitive uses continuation
  regression, the basis or estimator choice is explicit; LaguerreBasis is a common
  option, not a mandatory route primitive.'
- 'NTH-DEFAULT MC: Resolve the name-aligned terminal basket with
  resolve_credit_basket_inputs, bind positive n_paths and an explicit seed, sample
  one persistent GaussianCopula default-time matrix, and reduce each path through
  ranked_event_expected_weight. Construct TriggerSettlement and trigger_settlement_pv
  explicitly; do not substitute nth_to_default_probability, discard triggering-name
  identity, resample ranks independently, or call price_nth_to_default_basket. Reuse
  the same seed for base and +1bp spread reprices.'
- 'CREDIT-SURVIVAL MC: Single-name CDS uses an explicit payment/event grid and
  first-event weights. Nth-to-default instead uses multi-name correlated default-time
  order. Both require credit_curve and discount_curve and neither may route through
  Black76 or equity GBM option logic.'
- 'HESTON MC ROUTE: For European Heston vanilla options, prefer trellis.models.monte_carlo.stochastic_vol.price_heston_option_monte_carlo. Use scheme="heston_qe" for qe_heston and scheme="euler" for euler_heston / heston_mc. Bind explicit Heston model_parameters; do not read a Black vol surface unless a calibration problem explicitly maps the surface to Heston parameters.'
- 'AUTOCALLABLE MC ROUTE: For single-underlier autocallable proof tasks, prefer trellis.models.autocallable.price_autocallable_monte_carlo_result. It owns GBM exact-path simulation, observation-step mapping, first-trigger redemption, coupon accrual, terminal protection, and discounting. Use sampling="sobol" only for QMC comparison targets; pseudo-MC targets must not require Sobol primitives. Do not instantiate GBM with spot=... because spot belongs at simulation time.'
- 'DOUBLE-BARRIER MC ROUTE: For double-barrier proof tasks, use trellis.models.analytical.support.barriers double-barrier payoff/state primitives or explicit lower/upper BarrierMonitor objects. The generated adapter still owns process simulation, path count, discounting, and comparison-target sampling.'
qmc:
- 'LOW-DISCREPANCY SAMPLING: Use Sobol paths in balanced batches, preferably with
  a power-of-two path count such as 1024, 2048, or 4096. If you deviate, document
  the reason.'
- 'HONEST SCOPE: QMC in Trellis currently accelerates Monte Carlo estimators through
  Sobol normal draws and Brownian-bridge helpers. It is not a separate universal pricing
  engine.'
- 'BIAS VS VARIANCE: QMC can reduce estimator variance, but it does NOT remove time-discretization
  bias. Keep the same date coverage and step-count discipline required for ordinary
  Monte Carlo.'
copula:
- 'CALIBRATION: Default probabilities must be consistent with the input credit curve.
  For each name: P(default by T) = 1 - S(T) where S(T) = credit_curve.survival_probability(T).'
- 'HOMOGENEOUS NTH-DEFAULT: The copula comparison target is analytical one-factor
  rank integration over the resolved terminal marginal default mass. It is distinct
  from the Monte Carlo target, which must sample persistent default-time paths.'
pde_solver:
- 'GRID: Use at least 200 spatial points and 200+ time steps. For barrier options,
  use non-uniform grid concentrated near the barrier.'
- 'BOUNDARY CONDITIONS: Set V(0,t)=0 for calls, V(S_max,t)=S_max-K*exp(-r*(T-t)) for
  calls. For puts: V(0,t)=K*exp(-r*(T-t)), V(S_max,t)=0.'
- 'STABILITY: Crank-Nicolson (theta=0.5) is second-order but may oscillate near discontinuities.
  Use Rannacher smoothing (2-4 implicit steps at start) for digital/barrier payoffs.'
- 'PDE ROUTE SCOPE: Use Grid from trellis.models.pde.grid, BlackScholesOperator
  from trellis.models.pde.operator, and theta_method_1d from trellis.models.pde.theta_method.
  For American puts, pass exercise_values and exercise_fn=max. Keep lower_bc_fn / upper_bc_fn
  callables explicit for barrier and digital payoffs, and do not invent log_grid_pde,
  uniform_grid_pde, absorbing, or dirichlet helper tokens.'
- 'HESTON ADI PDE ROUTE: For European Heston vanilla ADI targets, bind canonical kappa/theta/xi/rho/v0 parameters through the Heston runtime binding boundary; do not read market_state.vol_surface as Heston parameters or imply recalibration without a recorded calibration problem.'
- 'DOUBLE-BARRIER PDE ROUTE: For lower/upper barrier options, build the bounded Black-Scholes grid on [lower_barrier, upper_barrier] with absorbing boundary functions and use the shared terminal payoff primitive. Generated code owns the PDE solve and any knock-in parity assembly.'
fft_pricing:
- 'HURD-ZHOU SPREAD ROUTE: For an explicit two-dimensional correlated-GBM spread
  target, construct the joint log-return characteristic function with
  `correlated_gbm_log_return_characteristic_function` and price with
  `hurd_zhou_spread_option_2d_fft`. Do not substitute one-dimensional Carr-Madan
  vanilla FFT or a product transform proxy.'
- 'CHARACTERISTIC FUNCTION CONVENTION: COS method expects CF of log-return log(S_T/S0).
  FFT (Carr-Madan) expects CF of log(S_T). Do NOT mix them.'
- 'HESTON TRANSFORM ROUTE: For European Heston vanilla options, prefer trellis.models.transforms.heston.price_heston_option_transform
  so route adapters bind underlier spot plus explicit model_parameters to FFT/COS
  instead of reading a Black vol surface.'
- 'HESTON v0 IS VARIANCE: v0=0.04 means vol=20%. Do NOT pass vol directly as v0.'
- 'COS TRUNCATION: Center on first cumulant c1, width L*sqrt(c2) where c2 is second
  cumulant. Default symmetric [-L, L] can overflow for high drift or long maturity.'
